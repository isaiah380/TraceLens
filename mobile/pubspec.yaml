name: tracelens
description: "AI-Powered Scam, Phishing Message and Malicious URL Detection Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP Networking for Backend Communication
  http: ^1.2.0

  # Camera QR Scanning
  mobile_scanner: ^5.2.3

  # Persistent Local Scan History
  sqflite: ^2.3.2
  path: ^1.9.0

  # Local preferences
  shared_preferences: ^2.2.2
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3

  # Icons & Formatting
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
